<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0F766E">
<title>Makhzan</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<style>
  :root { --accent: #0F766E; --accent-soft: #CCFBF1; }
  @media (prefers-color-scheme: dark) { :root { --accent: #5EEAD4; --accent-ink: #042F2B; --accent-soft: #0D3B37; } }
  .pos { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 14px; align-items: start; }
  @media (max-width: 1000px) { .pos { grid-template-columns: 1fr; } }
  .scan { display: flex; gap: 8px; }
  .scan input { font-size: 1.1rem; padding: 12px 14px; }
  .cats { display: flex; gap: 6px; flex-wrap: wrap; }
  .cats button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink, #fff); border-color: transparent; }
  .grid-p { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  .tile { font: inherit; color: inherit; text-align: start; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; cursor: pointer; display: grid; gap: 2px; min-height: 84px; }
  .tile:hover { border-color: var(--accent); }
  .tile b { font-size: .92rem; line-height: 1.3; }
  .tile .pr { color: var(--accent); font-weight: 700; }
  .tile.out { opacity: .5; }
  .cart { position: sticky; top: 12px; display: grid; gap: 10px; }
  .line { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .qty { display: inline-flex; align-items: center; gap: 4px; }
  .qty button { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; font-size: 1rem; }
  .qty input { width: 52px; text-align: center; padding: 4px; }
  .total { font-size: 2rem; font-weight: 800; font-variant-numeric: tabular-nums; }
  .methods { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .methods button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink, #fff); border-color: transparent; }
  .pay { font-size: 1.15rem; padding: 14px; justify-content: center; }
  video.cam { width: 100%; border-radius: 12px; background: #000; max-height: 260px; }
  td.num { white-space: nowrap; }
  .labels { display: grid; grid-template-columns: repeat(auto-fill, 52mm); gap: 4mm; }
  .lbl { border: 1px dashed #999; padding: 2mm; text-align: center; font-size: 11px; color: #000; background: #fff; }
  .lbl img { width: 100%; height: 14mm; }
  #print { display: none; }
  @media print {
    body > *:not(#print) { display: none !important; }
    #print { display: block; color: #000; font: 12px/1.45 "Segoe UI", "Noto Sans Arabic", Tahoma, sans-serif; }
    #print.thermal { width: 72mm; }
    #print .r { display: flex; justify-content: space-between; gap: 8px; }
    #print hr { border: 0; border-top: 1px dashed #000; margin: 6px 0; }
    #print .lbl { border: 0; }
    @page { margin: 4mm; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status"></div>
<div id="print"></div>
<script src="app.js"></script>
<script src="demo.js"></script>
</body>
</html>
